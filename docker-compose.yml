services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      # Pedidos, usuarios y menú (sobreviven reinicios)
      - ./backend/data:/app/data
    environment:
      - PORT=3000
      - DATABASE_PATH=/app/data/menu.db
      - REQUIRE_AUTH=1
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-24}
      - ENFORCE_PROD_CONFIG=${ENFORCE_PROD_CONFIG:-0}
    # Al abrir Docker Desktop, este contenedor vuelve solo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
